<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TaxoAdapt — Web Presentation</title>
<style>
:root{--bg:#07100d;--ink:#f4f7f5;--muted:#a7b2ad;--accent:#63d9a8;--line:#294137;--panel:#0d1814}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif}
body{color:var(--ink);user-select:none}
.app{position:fixed;inset:0;background:radial-gradient(circle at 80% 20%,rgba(99,217,168,.08),transparent 30%),#07100d}
.stage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;perspective:1400px}
.slide{position:absolute;width:min(94vw,calc(94vh*16/9));aspect-ratio:16/9;border-radius:18px;overflow:hidden;box-shadow:0 30px 100px rgba(0,0,0,.45);background:#fff;opacity:0;transform:translate3d(40%,0,0) scale(.92) rotateY(-6deg);filter:blur(8px);transition:transform 900ms cubic-bezier(.2,.8,.2,1),opacity 700ms ease,filter 700ms ease;will-change:transform,opacity,filter}
.slide img{display:block;width:100%;height:100%;object-fit:cover}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.03),transparent 40%,rgba(0,0,0,.04));pointer-events:none}
.slide.active{opacity:1;transform:translate3d(0,0,0) scale(1) rotateY(0);filter:blur(0)}
.slide.prev{opacity:0;transform:translate3d(-28%,0,0) scale(.88) rotateY(7deg);filter:blur(4px)}
.slide.next{opacity:0;transform:translate3d(18%,0,0) scale(.95) rotateY(-4deg);filter:blur(3px)}
.slide.zoom-in.active img{animation:imgIn 1.1s cubic-bezier(.2,.8,.2,1) both}
.slide.pan-left.active img{animation:panLeft 1.1s cubic-bezier(.2,.8,.2,1) both}
.slide.pan-right.active img{animation:panRight 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes imgIn{from{transform:scale(1.07)}to{transform:scale(1)}}
@keyframes panLeft{from{transform:scale(1.045) translateX(1.7%)}to{transform:scale(1) translateX(0)}}
@keyframes panRight{from{transform:scale(1.045) translateX(-1.7%)}to{transform:scale(1) translateX(0)}}
.topbar{position:absolute;z-index:30;top:0;left:0;right:0;height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:linear-gradient(to bottom,rgba(7,16,13,.82),rgba(7,16,13,0));pointer-events:none}
.brand{font-size:12px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.counter{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)} .counter strong{font-size:18px;color:var(--ink)}
.nav{position:absolute;z-index:40;right:34px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px}
.dot{width:4px;height:20px;border-radius:99px;background:#385148;transition:all .35s ease;cursor:pointer}.dot.active{height:38px;background:var(--accent);box-shadow:0 0 18px rgba(99,217,168,.35)}
.bottom{position:absolute;z-index:30;bottom:20px;left:34px;right:34px;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
.section{color:var(--muted);font-size:11px;letter-spacing:.15em;text-transform:uppercase}.hint{font-size:11px;color:#7f8b85}.hint kbd{border:1px solid #33443d;background:#101b17;padding:3px 7px;border-radius:5px;color:#b9c4bf}
.progress{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.08)} .progress span{display:block;height:100%;background:var(--accent);width:4%;transition:width .55s ease}
.scrim{position:absolute;inset:0;z-index:10;background:radial-gradient(circle at 50% 50%,transparent 45%,rgba(0,0,0,.25));pointer-events:none}
.clickzone{position:absolute;z-index:35;top:15%;bottom:15%;width:28%;cursor:pointer}.clickzone.left{left:0}.clickzone.right{right:0}
.overlay{position:absolute;z-index:25;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .5s ease}.overlay.show{opacity:1}.overlay .chip{padding:10px 14px;border:1px solid rgba(99,217,168,.35);background:rgba(7,16,13,.62);backdrop-filter:blur(14px);border-radius:999px;font-size:12px;color:#d7e2dc}
@media(max-width:900px){.topbar{padding:0 18px}.bottom{left:18px;right:18px}.nav{right:15px}.stage .slide{width:96vw}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><div class="brand">TaxoAdapt · Web Presentation</div><div class="counter"><strong id="cur">01</strong> / <span id="total">25</span></div></div>
  <div class="stage" id="stage"></div>
  <div class="scrim"></div>
  <div class="nav" id="nav"></div>
  <div class="bottom"><div class="section" id="section">INTRO</div><div class="hint"><kbd>←</kbd> <kbd>→</kbd> or <kbd>SPACE</kbd> to navigate · <kbd>F</kbd> fullscreen</div></div>
  <div class="progress"><span id="progress"></span></div>
  <div class="clickzone left" id="left"></div><div class="clickzone right" id="right"></div>
</div>
<script>
const slides = [
  ['INTRO','zoom-in'],['INTRO','pan-left'],['PROBLEM','zoom-in'],['PROBLEM','pan-right'],['ENGINEERING','zoom-in'],['ENGINEERING','pan-left'],['ENGINEERING','pan-right'],['ENGINEERING','zoom-in'],['ENGINEERING','pan-left'],['PHASE 01 · INFRA','zoom-in'],['PHASE 01 · INFRA','pan-right'],['PHASE 02 · STRATEGY','zoom-in'],['PHASE 02 · STRATEGY','pan-left'],['PHASE 03 · ARCHITECTURE','zoom-in'],['PHASE 03 · ARCHITECTURE','pan-right'],['PHASE 04 · OPERATIONS','zoom-in'],['PHASE 04 · OPERATIONS','pan-left'],['VALIDATION','zoom-in'],['VALIDATION','pan-right'],['VALIDATION','zoom-in'],['VALIDATION','pan-left'],['DEMO','zoom-in'],['OPERATIONS GUIDE','pan-right'],['OPERATIONS GUIDE','pan-left'],['TAKEAWAYS','zoom-in']
];
const stage=document.getElementById('stage'), nav=document.getElementById('nav'), cur=document.getElementById('cur'), total=document.getElementById('total'), progress=document.getElementById('progress'), section=document.getElementById('section');
let index=0, locked=false;
total.textContent=slides.length.toString().padStart(2,'0');
slides.forEach((s,i)=>{
  const el=document.createElement('div'); el.className='slide '+s[1]; el.dataset.index=i;
  const img=document.createElement('img'); img.src=`assets/slides/slide-${String(i+1).padStart(2,'0')}.png`; img.alt=`Slide ${i+1}`;
  el.appendChild(img); stage.appendChild(el);
  const d=document.createElement('div'); d.className='dot'; d.title=`${i+1}`; d.onclick=()=>go(i); nav.appendChild(d);
});
function render(){
  [...stage.children].forEach((el,i)=>{el.classList.remove('active','prev','next'); if(i===index)el.classList.add('active'); if(i===index-1)el.classList.add('prev'); if(i===index+1)el.classList.add('next')});
  [...nav.children].forEach((d,i)=>d.classList.toggle('active',i===index));
  cur.textContent=String(index+1).padStart(2,'0'); section.textContent=slides[index][0]; progress.style.width=((index+1)/slides.length*100)+'%';
}
function go(n){if(locked)return; n=Math.max(0,Math.min(slides.length-1,n)); if(n===index)return; locked=true; index=n; render(); setTimeout(()=>locked=false,520)}
function next(){go(index+1)} function prev(){go(index-1)}
let wheelLock=false;
window.addEventListener('wheel',e=>{e.preventDefault();if(wheelLock)return;wheelLock=true; e.deltaY>0?next():prev();setTimeout(()=>wheelLock=false,620)},{passive:false});
window.addEventListener('keydown',e=>{ if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();next()} else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev()} else if(e.key==='Home'){go(0)} else if(e.key==='End'){go(slides.length-1)} else if(e.key.toLowerCase()==='f'){document.documentElement.requestFullscreen?.()} });
document.getElementById('left').onclick=prev; document.getElementById('right').onclick=next;
let ty=0; window.addEventListener('touchstart',e=>ty=e.touches[0].clientY,{passive:true}); window.addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-ty;if(Math.abs(dy)>50)(dy<0?next:prev)},{passive:true});
render();
</script>
</body></html>
